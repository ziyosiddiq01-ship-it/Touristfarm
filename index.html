<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tourist Farm</title>
    <style>
      :root {
        --bg: #07121f;
        --bg2: #0d1d31;
        --card: #122740;
        --tx: #eaf1f8;
        --mut: #93a7bd;
        --ac: #2ee6a6;
        --ac2: #4aa8ff;
        --wm: #ffb454;
        --r: 18px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--tx);
        line-height: 1.6;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        max-width: 1200px;
        margin: auto;
        padding: 0 20px;
      }
      section {
        padding: 80px 0;
      }
      h2.t {
        font-size: clamp(26px, 4vw, 40px);
        margin-bottom: 8px;
      }
      p.s {
        color: var(--mut);
        margin-bottom: 36px;
        max-width: 640px;
      }
      .btn {
        display: inline-block;
        padding: 13px 26px;
        border-radius: 50px;
        border: 0;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        color: #04121f;
        transition: 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px #2ee6a644;
      }
      .btn.o {
        background: transparent;
        border: 1.5px solid #ffffff44;
        color: var(--tx);
      }
      header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 50;
        background: #07121fd9;
        backdrop-filter: blur(14px);
        border-bottom: 1px solid #ffffff12;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }
      .logo {
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 0.3px;
      }
      .logo b {
        color: var(--ac);
      }
      .links {
        display: flex;
        gap: 26px;
        font-size: 15px;
        color: var(--mut);
      }
      .links a:hover {
        color: var(--ac);
      }
      .burger {
        display: none;
        background: none;
        border: 0;
        color: var(--tx);
        font-size: 28px;
        cursor: pointer;
      }
      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding-top: 90px;
        background:
          radial-gradient(900px 500px at 80% 10%, #4aa8ff33, transparent),
          radial-gradient(700px 500px at 10% 90%, #2ee6a626, transparent),
          var(--bg);
      }
      .hero h1 {
        font-size: clamp(36px, 6vw, 68px);
        line-height: 1.1;
        margin-bottom: 18px;
      }
      .hero h1 span {
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p {
        color: var(--mut);
        font-size: 18px;
        max-width: 560px;
        margin-bottom: 30px;
      }
      .hero .cta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 46px;
      }
      .stats {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
      }
      .stats b {
        font-size: 32px;
        color: var(--ac);
        display: block;
      }
      .stats span {
        color: var(--mut);
        font-size: 14px;
      }
      .feat {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .fc {
        position: relative;
        border-radius: 24px;
        padding: 28px;
        min-height: 430px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid #ffffff1a;
      }
      .fc:hover {
        transform: translateY(-8px);
      }
      .fc .em {
        position: absolute;
        top: 18px;
        right: 22px;
        font-size: 86px;
        opacity: 0.95;
      }
      .fc .tag {
        align-self: flex-start;
        background: #00000055;
        padding: 5px 13px;
        border-radius: 30px;
        font-size: 12px;
        margin-bottom: 12px;
        font-weight: 700;
      }
      .fc h3 {
        font-size: 34px;
      }
      .fc p {
        opacity: 0.9;
        margin: 8px 0 16px;
        font-size: 15px;
      }
      .fc .pr {
        font-weight: 800;
        font-size: 20px;
      }
      .fc .pr small {
        font-weight: 400;
        opacity: 0.8;
        font-size: 13px;
      }
      .tools {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .tools input,
      .tools select,
      .form input,
      .form select,
      .form textarea,
      .calc select,
      .calc input {
        background: var(--bg2);
        border: 1px solid #ffffff1f;
        color: var(--tx);
        padding: 13px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        width: 100%;
      }
      .tools input {
        flex: 1;
        min-width: 220px;
        width: auto;
      }
      .tools select {
        width: auto;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--ac);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 26px;
      }
      .chip {
        padding: 8px 16px;
        border-radius: 30px;
        background: var(--bg2);
        border: 1px solid #ffffff1a;
        color: var(--mut);
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      .chip.on,
      .chip:hover {
        background: var(--ac);
        color: #04121f;
        border-color: var(--ac);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--card);
        border-radius: var(--r);
        overflow: hidden;
        cursor: pointer;
        border: 1px solid #ffffff12;
        transition: 0.25s;
        animation: in 0.5s both;
      }
      .card:hover {
        transform: translateY(-6px);
        border-color: var(--ac);
        box-shadow: 0 14px 34px #0006;
      }
      .card .top {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
      }
      .card .bd {
        padding: 16px 18px 18px;
      }
      .card h4 {
        font-size: 18px;
      }
      .card .ct {
        font-size: 12px;
        color: var(--ac);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card p {
        color: var(--mut);
        font-size: 14px;
        margin: 6px 0 12px;
        min-height: 44px;
      }
      .card .pp {
        font-weight: 700;
        color: var(--wm);
      }
      .card .pp small {
        color: var(--mut);
        font-weight: 400;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
        }
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 40px;
        display: none;
      }
      .more {
        text-align: center;
        margin-top: 30px;
      }
      .why {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 20px;
      }
      .why div {
        background: var(--card);
        padding: 28px;
        border-radius: var(--r);
        border: 1px solid #ffffff12;
      }
      .why i {
        font-style: normal;
        font-size: 34px;
        display: block;
        margin-bottom: 10px;
      }
      .why h4 {
        margin-bottom: 6px;
      }
      .why p {
        color: var(--mut);
        font-size: 14px;
      }
      .calc {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        background: var(--card);
        padding: 36px;
        border-radius: 24px;
        border: 1px solid #ffffff14;
      }
      .calc label {
        display: block;
        font-size: 13px;
        color: var(--mut);
        margin: 14px 0 6px;
      }
      .calc label:first-child {
        margin-top: 0;
      }
      .res {
        background: linear-gradient(160deg, #0f3a52, #0b2237);
        border-radius: 20px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .res .big {
        font-size: 48px;
        font-weight: 800;
        color: var(--ac);
      }
      .res ul {
        list-style: none;
        margin: 16px 0;
      }
      .res li {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed #ffffff22;
        color: var(--mut);
        font-size: 14px;
      }
      .res li b {
        color: var(--tx);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        counter-reset: s;
      }
      .steps div {
        counter-increment: s;
        background: var(--card);
        padding: 26px;
        border-radius: var(--r);
        position: relative;
      }
      .steps div:before {
        content: counter(s);
        position: absolute;
        top: -14px;
        left: 22px;
        background: var(--ac);
        color: #04121f;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .steps p {
        color: var(--mut);
        font-size: 14px;
      }
      .contact {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 36px;
      }
      .info div {
        background: var(--card);
        padding: 18px 22px;
        border-radius: 14px;
        margin-bottom: 14px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .info i {
        font-style: normal;
        font-size: 26px;
      }
      .info span {
        display: block;
        color: var(--mut);
        font-size: 13px;
      }
      .form {
        background: var(--card);
        padding: 30px;
        border-radius: 22px;
        display: grid;
        gap: 14px;
      }
      .form .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form textarea {
        min-height: 110px;
        resize: vertical;
      }
      footer {
        background: #050d17;
        padding: 36px 0;
        text-align: center;
        color: var(--mut);
        font-size: 14px;
        border-top: 1px solid #ffffff10;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000000b3;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        backdrop-filter: blur(6px);
      }
      .modal.open {
        display: flex;
      }
      .mb {
        background: var(--bg2);
        max-width: 860px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        border-radius: 24px;
        border: 1px solid #ffffff1f;
        animation: in 0.3s;
      }
      .mh {
        padding: 34px;
        display: flex;
        align-items: center;
        gap: 22px;
        position: relative;
      }
      .mh .fl {
        font-size: 84px;
        line-height: 1;
      }
      .mh h3 {
        font-size: 32px;
      }
      .mh span {
        opacity: 0.85;
      }
      .x {
        position: absolute;
        top: 14px;
        right: 16px;
        background: #00000066;
        color: #fff;
        border: 0;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
      }
      .mc {
        padding: 30px;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 30px;
      }
      .mc h5 {
        font-size: 13px;
        color: var(--ac);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 18px 0 8px;
      }
      .mc h5:first-child {
        margin-top: 0;
      }
      .mc p {
        color: #c5d3e2;
        font-size: 15px;
      }
      .pl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pl span {
        background: var(--card);
        padding: 7px 14px;
        border-radius: 30px;
        font-size: 13px;
      }
      .bx {
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
      }
      .bx li {
        list-style: none;
        display: flex;
        justify-content: space-between;
        padding: 7px 0;
        font-size: 14px;
        color: var(--mut);
      }
      .bx li b {
        color: var(--tx);
      }
      .bx .tt {
        border-top: 1px solid #ffffff22;
        margin-top: 8px;
        padding-top: 12px;
        font-size: 22px;
        color: var(--ac);
        font-weight: 800;
        display: flex;
        justify-content: space-between;
      }
      .bx .btn {
        width: 100%;
        margin-top: 14px;
        text-align: center;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--ac);
        color: #04121f;
        padding: 14px 26px;
        border-radius: 40px;
        font-weight: 700;
        z-index: 200;
        transition: 0.4s;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      @media (max-width: 900px) {
        .feat,
        .calc,
        .contact,
        .mc {
          grid-template-columns: 1fr;
        }
        .links {
          display: none;
          position: absolute;
          top: 68px;
          left: 0;
          right: 0;
          background: var(--bg2);
          flex-direction: column;
          padding: 20px;
          gap: 16px;
        }
        .links.open {
          display: flex;
        }
        .burger {
          display: block;
        }
        .mh {
          flex-direction: column;
          text-align: center;
        }
        .form .two {
          grid-template-columns: 1fr;
        }
      }

      .lang {
        display: flex;
        gap: 4px;
        background: var(--bg2);
        padding: 4px;
        border-radius: 30px;
        border: 1px solid #ffffff1a;
      }
      .lang button {
        background: none;
        border: 0;
        color: var(--mut);
        padding: 6px 12px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s;
      }
      .lang button.on {
        background: var(--ac);
        color: #04121f;
      }
      .rt {
        display: flex;
        align-items: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <nav>
          <a href="#top" class="logo">🌍 Tourist<b>Farm</b></a>
          <div class="links" id="links">
            <a href="#top" data-i="nav_home"></a
            ><a href="#hot" data-i="nav_hot"></a
            ><a href="#countries" data-i="nav_countries"></a
            ><a href="#calc" data-i="nav_calc"></a
            ><a href="#why" data-i="nav_why"></a
            ><a href="#contact" data-i="nav_contact"></a>
          </div>
          <div class="rt">
            <div class="lang">
              <button data-l="uz">UZ</button><button data-l="en">EN</button
              ><button data-l="ru">RU</button>
            </div>
            <button class="burger" id="burger" aria-label="Menu">☰</button>
          </div>
        </nav>
      </div>
    </header>

    <section class="hero" id="top">
      <div class="wrap">
        <h1 data-i="hero_h"></h1>
        <p data-i="hero_p"></p>
        <div class="cta">
          <a href="#countries" class="btn" data-i="b_view"></a
          ><a href="#calc" class="btn o" data-i="b_calc"></a>
        </div>
        <div class="stats">
          <div><b data-n="120">0</b><span data-i="st1"></span></div>
          <div><b data-n="15000">0</b><span data-i="st2"></span></div>
          <div><b data-n="12">0</b><span data-i="st3"></span></div>
          <div><b data-n="24">0</b><span data-i="st4"></span></div>
        </div>
      </div>
    </section>

    <section id="hot" style="background: var(--bg2)">
      <div class="wrap">
        <h2 class="t" data-i="hot_t"></h2>
        <p class="s" data-i="hot_s"></p>
        <div class="feat" id="feat"></div>
      </div>
    </section>

    <section id="countries">
      <div class="wrap">
        <h2 class="t">
          <span data-i="c_t"></span>
          <span id="cnt" style="color: var(--ac)"></span>
        </h2>
        <p class="s" data-i="c_s"></p>
        <div class="tools">
          <input id="q" type="search" data-ip="ph_q" /><select id="sort">
            <option value="n" data-i="s_n"></option>
            <option value="a" data-i="s_a"></option>
            <option value="d" data-i="s_d"></option>
          </select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" data-i="empty"></div>
        <div class="more">
          <button class="btn o" id="more" data-i="more"></button>
        </div>
      </div>
    </section>

    <section id="calc" style="background: var(--bg2)">
      <div class="wrap">
        <h2 class="t" data-i="calc_t"></h2>
        <p class="s" data-i="calc_s"></p>
        <div class="calc">
          <div>
            <label data-i="l_country"></label
            ><select id="cC"></select>
            <label><span data-i="l_days"></span>: <b id="dv">7</b></label
            ><input type="range" id="cD" min="3" max="30" value="7" />
            <label data-i="l_ppl"></label
            ><input type="number" id="cP" min="1" max="30" value="2" />
            <label data-i="l_hotel"></label
            ><select id="cH">
              <option value="0.8" data-i="h3"></option>
              <option value="1" selected data-i="h4"></option>
              <option value="1.45" data-i="h5"></option>
            </select>
          </div>
          <div class="res">
            <span style="color: var(--mut)" data-i="l_total"></span>
            <div class="big" id="rT">$0</div>
            <ul id="rL"></ul>
            <a
              href="#contact"
              class="btn"
              style="text-align: center"
              data-i="order"
            ></a>
          </div>
        </div>
      </div>
    </section>

    <section id="why">
      <div class="wrap">
        <h2 class="t" data-i="why_t"></h2>
        <p class="s" data-i="why_s"></p>
        <div class="why">
          <div>
            <i>💰</i>
            <h4 data-i="w1t"></h4>
            <p data-i="w1p"></p>
          </div>
          <div>
            <i>🛂</i>
            <h4 data-i="w2t"></h4>
            <p data-i="w2p"></p>
          </div>
          <div>
            <i>🧭</i>
            <h4 data-i="w3t"></h4>
            <p data-i="w3p"></p>
          </div>
          <div>
            <i>🛡️</i>
            <h4 data-i="w4t"></h4>
            <p data-i="w4p"></p>
          </div>
          <div>
            <i>📞</i>
            <h4 data-i="w5t"></h4>
            <p data-i="w5p"></p>
          </div>
          <div>
            <i>🎁</i>
            <h4 data-i="w6t"></h4>
            <p data-i="w6p"></p>
          </div>
        </div>
      </div>
    </section>

    <section style="background: var(--bg2)">
      <div class="wrap">
        <h2 class="t" data-i="how_t"></h2>
        <p class="s" style="margin-bottom: 46px" data-i="how_s"></p>
        <div class="steps">
          <div>
            <h4 data-i="s1t"></h4>
            <p data-i="s1p"></p>
          </div>
          <div>
            <h4 data-i="s2t"></h4>
            <p data-i="s2p"></p>
          </div>
          <div>
            <h4 data-i="s3t"></h4>
            <p data-i="s3p"></p>
          </div>
          <div>
            <h4 data-i="s4t"></h4>
            <p data-i="s4p"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2 class="t" data-i="con_t"></h2>
        <p class="s" data-i="con_s"></p>
        <div class="contact">
          <div class="info">
            <div>
              <i>📍</i>
              <p>
                <span data-i="i_addr"></span
                ><em style="font-style: normal" data-i="i_addr_v"></em>
              </p>
            </div>
            <div>
              <i>📞</i>
              <p><span data-i="i_phone"></span>+998 90 123 45 67</p>
            </div>
            <div>
              <i>✉️</i>
              <p><span data-i="i_mail"></span>info@touristfarm.uz</p>
            </div>
            <div>
              <i>💬</i>
              <p><span data-i="i_tg"></span>@touristfarm_uz</p>
            </div>
            <div>
              <i>🕘</i>
              <p>
                <span data-i="i_hours"></span
                ><em style="font-style: normal" data-i="i_hours_v"></em>
              </p>
            </div>
          </div>

          long: [
            "Italiya — jahon san'ati beshigi. Rimdagi Kolizey va Vatikan, Venetsiyaning kanallari, Florensiyadagi Uffitsi galereyasi, Amalfi sohili va Toskana vinzorlari sizni kutadi. Haqiqiy pitstsa, pasta, jelato va espresso — Italiya oshxonasi o'zi alohida sayohat. Poyezdlar bilan shaharlar orasida qulay harakatlanish mumkin.",
            "Italy is the cradle of world art. The Colosseum and the Vatican in Rome, the canals of Venice, the Uffizi Gallery in Florence, the Amalfi Coast and Tuscan vineyards await you. Real pizza, pasta, gelato and espresso — Italian cuisine is a journey of its own. Trains make it easy to travel between cities.",
            "Италия — колыбель мирового искусства. Вас ждут Колизей и Ватикан в Риме, каналы Венеции, галерея Уффици во Флоренции, побережье Амальфи и виноградники Тосканы. Настоящая пицца, паста, джелато и эспрессо — итальянская кухня сама по себе путешествие. Между городами удобно ездить на поездах.",
          ],
        },
      };

      const $ = (s) => document.querySelector(s),
        $$ = (s) => document.querySelectorAll(s);
      let lang = "uz",
        cur = 0,
        cont = "all",
        shown = 24;
      try {
        lang = localStorage.getItem("tf_lang") || "";
      } catch (e) {}
      if (!T[lang]) {
        const b = (navigator.language || "uz").slice(0, 2);
        lang = T[b] ? b : "uz";
      }
      const t = (k) => T[lang][k] ?? T.uz[k] ?? k;
      const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
      const D = RAW.split("\n").map((l, i) => {
        const p = l.split("|");
        return {
          id: i,
          name: p[0],
          flag: p[1],
          c: p[2],
          cap: p[3],
          price: +p[4],
          desc: p[5],
          places: p[6].split(","),
        };
      });
      const parse = (r) =>
        r.split("\n").map((l) => {
          const p = l.split("|");
          return { n: p[0], cap: p[1], desc: p[2], places: p[3].split(",") };
        });
      const LD = {
        uz: D.map((c) => ({
          n: c.name,
          cap: c.cap,
          desc: c.desc,
          places: c.places,
        })),
        en: parse(EN),
        ru: parse(RU),
      };
      const L = (c) => LD[lang][c.id] || LD.uz[c.id];
      const cname = (c) => CONT[c][LI[lang]];
      const byName = (n) => D.find((x) => x.name === n);
      const brl = () => t("br").split("|");
      const BP = [0.4, 0.3, 0.12, 0.12, 0.06];
      const price = (c, days = 7, ppl = 1, h = 1) =>
        c.price * (days / 7) * ppl * h;

      function buildFeat() {
        $("#feat").innerHTML = Object.keys(HOT)
          .map((n) => {
            const c = byName(n),
              h = HOT[n];
            return `<div class="fc" style="background:${h.bg}" data-id="${c.id}"><div class="em">${c.flag}</div><span class="tag">${h.tag[LI[lang]]}</span><h3>${L(c).n}</h3><p>${L(c).desc}.</p><div class="pr">${usd(c.price)} <small>${t("from_p")}</small></div></div>`;
          })
          .join("");
      }
      function buildChips() {
        $("#chips").innerHTML =
          `<span class="chip${cont === "all" ? " on" : ""}" data-c="all">${t("all")}</span>` +
          Object.keys(CONT)
            .map(
              (k) =>
                `<span class="chip${cont === k ? " on" : ""}" data-c="${k}">${cname(k)}</span>`,
            )
            .join("");
      }
      $("#chips").onclick = (e) => {
        const c = e.target.closest(".chip");
        if (!c) return;
        cont = c.dataset.c;
        shown = 24;
        buildChips();
        render();
      };
      $("#q").oninput = () => {
        shown = 24;
        render();
      };
      $("#sort").onchange = render;
      $("#more").onclick = () => {
        shown += 24;
        render();
      };

      function render() {
        const q = $("#q").value.trim().toLowerCase(),
          s = $("#sort").value;
        const list = D.filter(
          (c) =>
            (cont === "all" || c.c === cont) &&
            (!q ||
              ["uz", "en", "ru"]
                .map((k) => {
                  const x = LD[k][c.id];
                  return x.n + " " + x.cap + " " + x.places.join(" ");
                })
                .join(" ")
                .toLowerCase()
                .includes(q)),
        );
        if (s === "a") list.sort((a, b) => a.price - b.price);
        else if (s === "d") list.sort((a, b) => b.price - a.price);
        else list.sort((a, b) => L(a).n.localeCompare(L(b).n, lang));
        $("#grid").innerHTML = list
          .slice(0, shown)
          .map(
            (c, i) =>
              `<div class="card" data-id="${c.id}" style="animation-delay:${(i % 12) * 0.04}s"><div class="top" style="background:${CG[c.c]}">${c.flag}</div><div class="bd"><div class="ct">${cname(c.c)}</div><h4>${L(c).n}</h4><p>${L(c).desc}</p><div class="pp">${usd(c.price)} <small>${t("from7")}</small></div></div></div>`,
          )
          .join("");
        $("#empty").style.display = list.length ? "none" : "block";
        $("#more").parentElement.style.display =
          list.length > shown ? "block" : "none";
        $("#cnt").textContent = "(" + list.length + ")";
      }
      document.addEventListener("click", (e) => {
        const c = e.target.closest("[data-id]");
        if (c) openM(+c.dataset.id);
      });

      function openM(id) {
        cur = id;
        const c = D[id],
          h = HOT[c.name],
          l = L(c),
          i = LI[lang];
        $("#mb").innerHTML =
          `<div class="mh" style="background:${h ? h.bg : CG[c.c]}"><button class="x" onclick="closeM()" aria-label="Close">✕</button><div class="fl">${c.flag}</div><div><h3>${l.n}</h3><span>${cname(c.c)} · ${t("m_cap")}: ${l.cap}</span></div></div>
 <div class="mc"><div>
 <h5>${t("m_about")}</h5><p>${h ? h.long[i] : l.desc + ". " + t("gen").replace("{n}", l.n)}</p>
 <h5>${t("m_see")}</h5><div class="pl">${l.places.map((p) => `<span>📍 ${p}</span>`).join("")}</div>
 <h5>${t("m_season")}</h5><p>${h ? h.season[i] : SEAS[c.c][i]}</p>
 <h5>${t("m_incl")}</h5><p>${t("m_incl_v")}</p>
 </div><div class="bx"><h5 style="margin:0 0 10px;color:var(--ac)">${t("m_break")}</h5><ul>${brl()
   .map((b, k) => `<li><span>${b}</span><b>${usd(c.price * BP[k])}</b></li>`)
   .join(
     "",
   )}</ul><div class="tt"><span>${t("m_total")}</span><span>${usd(c.price)}</span></div><a href="#calc" class="btn" onclick="toCalc(${id})">${t("m_calc")}</a><a href="#contact" class="btn o" style="width:100%;margin-top:10px;text-align:center" onclick="toForm(${id})">${t("m_apply")}</a></div></div>`;
        $("#modal").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeM() {
        $("#modal").classList.remove("open");
        document.body.style.overflow = "";
      }
      $("#modal").onclick = (e) => {
        if (e.target.id === "modal") closeM();
      };
      document.onkeydown = (e) => {
        if (e.key === "Escape") closeM();
      };
      function toCalc(id) {
        closeM();
        $("#cC").value = id;
        calc();
      }
      function toForm(id) {
        closeM();
        $("#fc").value = id;
      }

      function buildOpts() {
        const o = D.slice()
          .sort((a, b) => L(a).n.localeCompare(L(b).n, lang))
          .map((c) => `<option value="${c.id}">${c.flag} ${L(c).n}</option>`)
          .join("");
        const v1 = $("#cC").value || byName("Yaponiya").id,
          v2 = $("#fc").value;
        $("#cC").innerHTML = o;
        $("#fc").innerHTML = `<option value="">${t("ph_country")}</option>` + o;
        $("#cC").value = v1;
        $("#fc").value = v2;
      }
      function calc() {
        const c = D[+$("#cC").value],
          d = +$("#cD").value,
          p = Math.max(1, +$("#cP").value || 1),
          h = +$("#cH").value;
        $("#dv").textContent = d;
        const tt = price(c, d, p, h);
        $("#rT").textContent = usd(tt);
        $("#rL").innerHTML =
          brl()
            .map(
              (b, k) => `<li><span>${b}</span><b>${usd(tt * BP[k])}</b></li>`,
            )
            .join("") +
          `<li><span>${t("per")}</span><b>${usd(tt / p)}</b></li>`;
      }
      ["cC", "cD", "cP", "cH"].forEach((i) =>
        $("#" + i).addEventListener("input", calc),
      );

      $("#form").onsubmit = (e) => {
        e.preventDefault();
        e.target.reset();
        toast(t("toast"));
      };
      function toast(m) {
        const x = $("#toast");
        x.textContent = m;
        x.classList.add("show");
        setTimeout(() => x.classList.remove("show"), 3500);
      }

      function setLang(l) {
        lang = l;
        try {
          localStorage.setItem("tf_lang", l);
        } catch (e) {}
        document.documentElement.lang = l;
        document.title = t("title");
        $$("[data-i]").forEach((e) => (e.innerHTML = t(e.dataset.i)));
        $$("[data-ip]").forEach((e) => (e.placeholder = t(e.dataset.ip)));
        $$(".lang button").forEach((b) =>
          b.classList.toggle("on", b.dataset.l === l),
        );
        $("#foot").textContent =
          "© " + new Date().getFullYear() + " Tourist Farm. " + t("foot");
        buildChips();
        buildFeat();
        buildOpts();
        render();
        calc();
        if ($("#modal").classList.contains("open")) openM(cur);
      }
      $$(".lang button").forEach(
        (b) => (b.onclick = () => setLang(b.dataset.l)),
      );
      $("#burger").onclick = () => $("#links").classList.toggle("open");
      $("#links").onclick = () => $("#links").classList.remove("open");
      const io = new IntersectionObserver((es) =>
        es.forEach((e) => {
          if (!e.isIntersecting) return;
          const el = e.target,
            n = +el.dataset.n;
          let v = 0;
          const st = Math.ceil(n / 60);
          const iv = setInterval(() => {
            v = Math.min(n, v + st);
            el.textContent = v.toLocaleString("en-US");
            if (v >= n) clearInterval(iv);
          }, 25);
          io.unobserve(el);
        }),
      );
      $$("[data-n]").forEach((el) => io.observe(el));
      setLang(lang);
    </script>
  </body>
</html>
